<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AE Player - Sincronizar Lista</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #050505; /* Fundo super escuro baseado na logo */
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }

    .container {
      background: #0a0a0a;
      border: 1px solid #330000;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.15); /* Brilho vermelho sutil ao redor do card */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-container {
      margin-bottom: 20px;
    }

    .logo-container img {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); /* Brilho neon da logo */
      object-fit: cover;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ff3333 0%, #990000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      letter-spacing: 1px;
    }

    p.subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 32px;
      font-size: 16px;
    }

    #sync-form {
      width: 100%;
    }

    .form-group {
      margin-bottom: 24px;
      width: 100%;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #ccc;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: #000;
      border: 1px solid #330000;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: #ff0000;
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.4); /* Foco vermelho neon */
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #cc0000 0%, #660000 100%);
      color: #fff;
      border: 1px solid #ff0000;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
      background: linear-gradient(135deg, #ff0000 0%, #990000 100%);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
    }

    #status-message {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      min-height: 20px;
    }
    
    .success { color: #10b981; }
    .error { color: #ff3333; }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-container">
      <img src="icon_large.png" alt="AE Player Logo">
    </div>
    <h1>AE Player</h1>
    <p class="subtitle">Sincronize sua lista IPTV com a TV</p>

    <form id="sync-form">
      <div class="form-group">
        <label for="mac-input">Endereço MAC da TV</label>
        <input type="text" id="mac-input" placeholder="Ex: 00:11:22:33:44:55" required>
      </div>

      <div class="form-group">
        <label for="url-input">URL da Lista M3U</label>
        <input type="url" id="url-input" placeholder="http://sua-lista.com/playlist.m3u" required>
      </div>

      <button type="submit" id="submit-btn">Sincronizar</button>
      <div id="status-message"></div>
    </form>
  </div>

  <!-- Firebase v10 Modular SDK via CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCEqGS3OIB0mgN5_6fo9DSqziffAke4fOE",
      authDomain: "aeplayer.firebaseapp.com",
      databaseURL: "https://aeplayer-default-rtdb.firebaseio.com",
      projectId: "aeplayer",
      storageBucket: "aeplayer.firebasestorage.app",
      messagingSenderId: "817829625225",
      appId: "1:817829625225:web:18d7edbdf4ab9f2382b558",
      measurementId: "G-7WZRF54F4P"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const form = document.getElementById('sync-form');
    const statusMsg = document.getElementById('status-message');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const macAddress = document.getElementById('mac-input').value.trim().toUpperCase();
      const m3uUrl = document.getElementById('url-input').value.trim();

      const safeMac = macAddress.replace(/:/g, '-');

      submitBtn.textContent = "Sincronizando...";
      submitBtn.disabled = true;
      statusMsg.textContent = "";
      statusMsg.className = "";

      try {
        await set(ref(db, 'devices/' + safeMac), {
          url: m3uUrl,
          updatedAt: new Date().toISOString()
        });
        
        statusMsg.textContent = "Lista sincronizada com sucesso! Abra o app na TV.";
        statusMsg.className = "success";
        form.reset();
      } catch (error) {
        statusMsg.textContent = "Erro ao sincronizar: " + error.message;
        statusMsg.className = "error";
      } finally {
        submitBtn.textContent = "Sincronizar";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
